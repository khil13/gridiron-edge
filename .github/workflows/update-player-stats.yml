name: Update player stats snapshot

# Keeps src/data/generated/player-stats.json current with nflverse's public
# release, which updates after each week's games. Committing straight to
# main (no PR) because this is a data refresh, not a code change, and it's
# idempotent — a no-op week produces no diff and no commit. The push to
# main triggers the existing deploy workflow, so the site picks up fresh
# rates on its next rebuild automatically.
#
# `npm run player-stats` also writes team-defense.json and player-ngs.json
# (see fetch-player-stats.mjs) — both must be in the diff check and the
# commit below, or a week where only one of those two changed (NGS runs on
# its own slower, independent publishing schedule) would silently produce
# no commit at all, leaving real fetched data sitting uncommitted in the
# runner's working tree and discarded when it tears down.
on:
  schedule:
    # Tuesday and Friday mornings UTC — after Monday Night Football and
    # again before the weekend slate, comfortably past nflverse's own
    # post-game processing window.
    - cron: '0 12 * * 2,5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run player-stats

      # Re-grade the player projections against the results just fetched
      # (see scripts/grade-props.mjs) so the Card's track record stays
      # current. Allowed to fail here without blocking the stats commit
      # below — fresh stats matter more than a fresh report card — but the
      # last step turns the run red if it did, so a broken grader is seen
      # rather than silently leaving an old record on the site.
      - name: Grade the projections
        id: grade
        continue-on-error: true
        run: npm run prop-accuracy

      - name: Commit if the snapshot changed
        run: |
          FILES="src/data/generated/player-stats.json src/data/generated/player-stats-meta.json src/data/generated/team-defense.json src/data/generated/player-ngs.json src/data/generated/prop-accuracy.json"
          if git diff --quiet -- $FILES; then
            echo "No change in player stats, team defense, NGS or the projection record this run."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add $FILES
          git commit -m 'Update player stats snapshot'
          git push

      - name: Fail the run if grading failed
        if: steps.grade.outcome == 'failure'
        run: |
          echo "::error::npm run prop-accuracy failed — the projection track record was not refreshed."
          exit 1
