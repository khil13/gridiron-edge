name: Probe ESPN scoreboard from Actions runner

# One-off diagnostic: the Scores page reports no live-game updates. Checks
# whether ESPN's scoreboard endpoint (a different one from /athletes/{id}/
# stats, which is confirmed IP-blocked) is actually reachable and returning
# real game states right now, from a network independent of the dev
# sandbox. Manual trigger only — not a feature, removed once answered.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Request the live scoreboard from both known hosts
        run: |
          for host in site.web.api.espn.com site.api.espn.com; do
            echo "=== $host ==="
            status=$(curl -s -o /tmp/body.json -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
              "https://$host/apis/site/v2/sports/football/nfl/scoreboard")
            echo "HTTP status: $status"
            if [ "$status" = "200" ]; then
              node -e "
                const d = require('/tmp/body.json');
                const events = d.events || [];
                console.log('event count:', events.length);
                for (const e of events) {
                  console.log(e.date, e.status?.type?.state, e.status?.type?.shortDetail, e.name);
                }
              "
            else
              head -c 500 /tmp/body.json
              echo
            fi
          done
