name: Probe ESPN stats endpoint from Actions runner

# One-off diagnostic: checks whether ESPN's bot protection on
# /athletes/{id}/stats blocks GitHub Actions' outbound IPs the same way it
# blocks a Cloudflare Worker's (confirmed 403 there even with browser
# User-Agent/Referer/Origin headers). Manual trigger only — this is not a
# feature, just a fast answer before building a real fetch workflow on top
# of it.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Request a real athlete's stats with no special headers
        run: |
          status=$(curl -s -o /tmp/body.json -w '%{http_code}' \
            'https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/athletes/4361741/stats')
          echo "HTTP status (no headers): $status"
          head -c 300 /tmp/body.json
          echo

      - name: Request the same athlete's stats with browser-like headers
        run: |
          status=$(curl -s -o /tmp/body.json -w '%{http_code}' \
            -H 'User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36' \
            -H 'Accept: application/json' \
            -H 'Referer: https://www.espn.com/' \
            -H 'Origin: https://www.espn.com' \
            'https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/athletes/4361741/stats')
          echo "HTTP status: $status"
          echo "--- body (first 500 bytes) ---"
          head -c 500 /tmp/body.json
          echo
          if [ "$status" != "200" ]; then
            echo "::error::ESPN returned $status, not 200"
            exit 1
          fi
