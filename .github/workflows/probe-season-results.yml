name: Probe season results (temporary diagnostic)

# One-off: dump the raw weekly ESPN scoreboard data for every DEN game in
# the 2026 regular season, to diagnose a reported discrepancy (app showed
# Broncos 3-0, real record is 2-1). This sandbox's own network policy
# blocks ESPN directly, so this runs on a real GitHub Actions runner
# instead. Remove this file once the diagnosis is done.
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/probe-den.mjs
